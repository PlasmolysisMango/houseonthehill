      - { kind: stat_shift, target: all, stat: sanity, delta: -1 }

  - id: 7
    name_cn: "迷失方向"
    name_en: "You Lose Your Way"
    kind: event
    text: "你在走廊里迷失了方向。本回合结束剩余移动力。"
    effects:
      - { kind: manual, note: "本回合剩余移动力归零" }

  - id: 8
