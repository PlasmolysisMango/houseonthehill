# Placeholder card data for ROADMAP stage 4. The eventual full deck will
# be extracted from the rulebook PDF / docs in stage 1; this seed file
# keeps the runtime exercisable end-to-end (draw → resolve → log).
#
# Schema:
#   id        unique within a deck
#   name_cn   localized display title
#   name_en   English display title
#   kind      event | item | omen
#   text      one paragraph of flavour / rule text shown in the modal
#   effects   optional list of resolvable effects:
#               kind: stat_shift | manual
#               target: self | all     (default self)
#               stat:   might | speed | sanity | knowledge
#               delta:  signed integer
#               note:   for manual: short hint shown in the log
#
# Cards without effects show the text only and the player resolves them.

events:
  - id: 1
    name_cn: "神秘的羊皮卷"
    name_en: "Mystic Scroll"
    kind: event
    text: "你研读了神秘的羊皮卷。知识 +1。"
    effects:
      - { kind: stat_shift, target: self, stat: knowledge, delta: 1 }

  - id: 2
    name_cn: "突如其来的眩晕"
    name_en: "Sudden Dizziness"
    kind: event
    text: "天旋地转。神志 -1。"
    effects:
      - { kind: stat_shift, target: self, stat: sanity, delta: -1 }

  - id: 3
    name_cn: "强身的早餐"
    name_en: "Hearty Breakfast"
    kind: event
    text: "你吃了一顿丰盛的早餐。强壮 +1。"
    effects:
      - { kind: stat_shift, target: self, stat: might, delta: 1 }

  - id: 4
    name_cn: "扭伤的脚踝"
    name_en: "Twisted Ankle"
    kind: event
    text: "脚下打滑。速度 -1。"
    effects:
      - { kind: stat_shift, target: self, stat: speed, delta: -1 }

  - id: 5
    name_cn: "突破"
    name_en: "Breakthrough"
    kind: event
    text: "灵光乍现，所有玩家知识 +1。"
    effects:
      - { kind: stat_shift, target: all, stat: knowledge, delta: 1 }

  - id: 6
    name_cn: "尖叫声"
    name_en: "Distant Scream"
    kind: event
    text: "远处传来一声尖叫。所有玩家神志 -1。"
