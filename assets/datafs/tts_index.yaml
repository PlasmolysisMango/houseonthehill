  - nickname: "[29BD08]彼得·秋元[-]"
    kind: "Custom_Model"
    guid: "9f5259"
    description: "年龄：13岁 身高：4尺11寸 爱好：收集虫子，打篮球 生日：9月3日 在这世上，彼得最喜欢的两个地方一是篮球场，一是自家屋子底下。喜欢篮球场是因为在那儿可以打他最喜欢的篮球，喜欢自家屋子底下则是因为那儿是抓虫子的好地方，而且，在那儿可以躲开他的5个哥哥。虽然哥哥们捉弄小弟弟玩是人之常情，但他们家的哥哥们欺负起人来也太厉害了点儿，被家里人弄断了骨头算什么事？彼得喜欢虫子，长大了想当个昆虫学家，一个可以永远不用搭理兄弟们的昆虫学家。 彼得帮朗费罗教授收拾草坪赚零花钱，顺便在那儿还能找到好多虫子，真棒！他和蜜西是同学。蜜西总喜欢扮医生给他检查，有时也照顾他真的断了的那些骨头，但当彼得把自己收藏的虫子给蜜西看的时候，蜜西并不高兴。彼得最怕被关在再也跑不出去的地方。"
  - nickname: "[29BD08]彼得·秋元[-]"
    kind: "Custom_Model"
