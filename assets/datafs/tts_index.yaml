  - nickname: "[CF6801]密西·多布拉德[-]"
    kind: "Custom_Model"
    guid: "cfbd5e"
    description: "年龄：9岁 身高：4尺2寸 体重：62磅 爱好：游泳，医学 生日：2月14日 蜜西长大了啥也不想当，就想当个医生。在这广阔世界上，她这辈子最喜欢的礼物就是她得到的第一套医生诊疗箱玩具。蜜西会和任何愿意陪她的人玩“医生病人”游戏。她甚至常把在后院里找到的死青蛙以及其他一些东西切开玩儿。但有时也会发生一些糟糕的事，蜜西会梦到很多死青蛙涌上她的小床，弄得她喘不过气来，这种时候，她就会大声尖叫。 蜜西与彼得是同学，知道他收藏着一整套胖乎乎的虫子。她上主日学校时认识了莱恩神父，神父说话挺好玩而且闻着有股子巧克力味。蜜西与布兰登住一个街区，布兰登总给他们家送报纸。虽然蜜西和布兰登不熟，但觉得他挺可爱的。蜜西最怕已经死掉的东西又活转过来追她。"
