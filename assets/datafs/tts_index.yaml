  - nickname: "[7F00B8]珍妮·勒克莱尔[-]"
    kind: "Custom_Model"
    guid: "ecea75"
    description: "年龄：21岁 身高：5尺7寸 体重：142磅 爱好：阅读，踢足球 生日：3月4日 珍妮是个安静的姑娘。她喜爱踢足球，但有时她实在太害羞了，以至于不能与队友好好合作，发挥自己应有的水平。珍妮最大的乐趣是一个人缩着阅读厚厚的书本，越老越旧的书越好。书本是她的避难所，能让她暂时忘记自己母亲的失踪。14年前，珍妮的母亲出门买东西，却再也没能回来，从此留下珍妮一个人，孤零零的。 珍妮唯一真正的朋友是西泽的姐姐凯特琳。珍妮也认识“公牛”彼罗斯，他们都住在桑椹街上，是只隔着几户的邻居。珍妮还认识左思泽，他们是在图书馆相遇的，两个人都十分喜欢那地方。珍妮最大的恐惧是一个人困在人群中或迷失在空旷的地方。"
  - nickname: "[7F00B8]西瑟·格兰维尔[-]"
    kind: "Custom_Model"
    guid: "1e1339"
  - nickname: "[7F00B8]西瑟·格兰维尔[-]"
    kind: "Custom_Model"
    guid: "73348f"
    description: "年龄：18 身高：5尺2寸 体重：120磅 爱好：看电视，购物 生日：8月2日 西泽永远都是完美的，完美的娇小身形，完美的金发碧眼，完美的待人接物，完美，完美，还是完美。生活中哪怕最细枝末节，最微不足道的不完美，也会令西泽头痛无比。有时候，这头痛严重得就像有什么东西正从她的脑子里向外挖。但即使在最难受的时候，西泽脸上完美的微笑也从未消失。 西泽的姐姐是珍妮的朋友。西泽也弄不清她们究竟是怎样成为朋友的，毕竟，珍妮显然很不完美。西泽在学校时认识了“闪电”达瑞和朗费罗教授。维维安是西泽母亲的一个老朋友。西泽最大的恐惧是——她自己其实并不那么完美。"
  - nickname: "[B60000]“公牛”彼罗斯[-]"
    kind: "Custom_Model"
    guid: "056406"
    description: "年龄：23岁 身高：6尺4寸 体重：288磅 爱好：橄榄球，收集闪亮的东西 生日：10月18日 彼罗斯就像个长不大的大男孩，永不认输，永远是把对手打打翻在地的那一个——当然是在有必要的时候。但却有过那么一次例外。虽然彼罗斯不愿意回忆这件事，可在寒冷孤独的夜晚，鲜血与尖叫就会悄悄爬出来，成为他盘踞不去的梦魇。彼罗斯非常怕黑。 彼罗斯自幼就认识珍妮，他们都住在桑椹街，是一起长大的邻居。他在格林威治大学结识了朗费罗教授。从彼罗斯还是个孩子时起，莱恩神父就是他的忏悔神父，但有一件罪过他却从未提及过。"
