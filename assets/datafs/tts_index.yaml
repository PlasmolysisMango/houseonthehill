  - nickname: "[ffffff]朗费罗教授[-]"
    kind: "Custom_Model"
    guid: "53eb46"
    description: "年龄：57岁 身高：5尺11寸 体重：153磅 爱好：凯尔特音乐，歌剧，上好红酒 生日：6月27日 约书亚·朗费罗教授对他的贵族家世颇为自豪。他们家曾经很富有，直到教授的父亲把家产全花在了赌博与酗酒上……朗费罗教授和他的老母亲住在一栋破败的维多利亚式大宅里，这宅子以前可是镇上最好的房子。教授的父亲在某个日子里消失不见了，就这么跑了。朗费罗教授的母亲投了一笔相当数额的人寿保险，自然咯，不管这是多么大的一笔钱，教授并没有近期内就回收这保金的打算。朗费罗教授认识“公牛”彼罗斯，“闪电”达瑞，以及西泽，他们都是他大学里的学生。布兰登为他家送报纸。彼得给他家剪草坪，也做些其他杂事。教授最大的恐惧是失去他所拥有的一切，那样人人都会知道他与他那游手好闲的父亲一样一事无成。"
  - nickname: "[ffffff]朗费罗教授[-]"
    kind: "Custom_Model"
    guid: "c57a00"
  - nickname: "[ffffff]莱因哈特神父[-]"
    kind: "Custom_Model"
    guid: "0c94f7"
    description: "年龄：62岁 身高：5尺9寸 体重：185磅 爱好：辩论，园艺 生日：4月29日 莱恩神父生在德国慕尼黑，15岁那年随家人迁居美国。接下来的3年里他过得非常糟糕，心灰意冷的莱恩转向宗教寻求慰藉，想知道为什么别人都对他这么坏。莱恩进了神学院，成了一名神父。自那以后，就有许多人找他忏悔自己的罪行，其中有个男人最让他困扰。这个陌生人每隔几年就会出现，坐在忏悔间里对他低语些谋杀啦疯狂啦之类的。近几年来，莱恩神父发现自己开始同意这个疯子的论调。鲜血，痛苦，死亡——它们都是生活的一部分，都是上帝计划的一部分，难道不是么？ 莱恩神父与维维安以及左思泽夫人挺熟，他常在“书面之物”旧书店里遇上她们。神父认识“公牛”彼罗斯，他总来忏悔些鸡毛蒜皮的小罪过。神父也认识蜜西，因为她来上主日学校。神父最怕的是自己陷入疯狂。"
