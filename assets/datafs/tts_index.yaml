  - nickname: "[0781BF]左思泽夫人[-]"
    kind: "Custom_Model"
    guid: "26f5a9"
    description: "年龄：37岁 身高：5尺 体重：150磅 爱好：占星，烹饪，棒球 生日：12月10日 左思泽夫人，或者“贝拉迪娜”（这是她妈妈给她起的名字，意思是孤挺花），还是个大学生时就成了一位塔罗占卜师，她也能从茶叶里看到未来。大学时，她在一间专卖神秘学书籍的铺子里坐堂算命打短工，现在则在自己家里操持占星师的行当。虽然左思泽夫人靠用纸牌算命谋生，但她从不替自己算命。她害怕从塔罗牌里看到自己的死亡，这事儿她连想都不敢想。 左思泽夫人与维维安以及莱恩神父都挺熟，他们是在维维安的书店里认识的。左思泽有个侄儿叫“闪电”达瑞，每逢圣诞节和他生日的时候，左思泽都会送他礼物，从无例外。左思泽常在图书馆里遇到珍妮，也常替佐伊的妈妈解读塔罗牌里的预兆。左思泽夫人对于死亡，特别是她自己的死，怀有深深的恐惧。"
  - nickname: "[0781BF]左思泽夫人[-]"
