  - nickname: "[0781BF]薇薇安·洛佩兹[-]"
    kind: "Custom_Model"
    guid: "353207"
    description: "年龄：42岁 身高：5尺5寸 体重：142磅 爱好：老电影，马 生日：1月11日 维维安认为完美的一天应该这样度过：睡个懒觉，然后来点儿咖啡和甜甜圈当早餐，之后骑马逛上一整天。可惜这种好日子并不多，因为维维安得努力经营自己赖以谋生的那间叫做“书面之物”的旧书店，免得破产。有些时候，维维安会陷入沮丧之中，恨不能把书店一把火烧掉了事，或者只点着后院那个小棚子也不错……或者，把学校给点着呢……维维安从未把这些念头付诸实践，只不过，她时不时会做噩梦，梦到自己正划亮火柴。 维维安是西泽的母亲莎拉的朋友。她也认识左思泽与莱恩神父，这两人是她书店里的常客。为了赚点儿外快，维维安这几年来时不时给蜜西当保姆，至少每月一次。维维安最大的恐惧与火焰有关，同时，她也害怕对火焰着迷的自己。"
  - nickname: "[29BD08]布兰登·贾斯珀[-]"
    kind: "Custom_Model"
    guid: "197e6f"
    description: "年龄：12岁 身高：5尺1寸 体重：109磅 爱好：电脑，野营，曲棍球 生日：5月21日 布兰登最爱电脑和野营。不管到那儿，他都随身带着他的新便携电脑，这样他就可以一边野营一边编程了。那才叫酷呢。布兰登从不喜欢玩那些一般的玩具，比方说动作玩偶之类的东西。实际上，布兰登讨厌玩偶。小时候，他有过一个小丑玩偶，有时候他早晨起来会发现那玩偶在他睡着的时候朝他接近了，有一次甚至手里还攥了把厨刀。布兰登很肯定这是他的哥哥克里斯搞的恶作剧，就想看他出丑，但他仍然讨厌玩偶。 布兰登野营时常遇到佐伊一家，但佐伊总躲在帐篷里玩娃娃，真讨厌。布兰登给朗费罗教授送报纸（送去他那老旧又怪诞的大房子里），也给蜜西家送。布兰登最怕玩偶，特别是小丑玩偶。"
  - nickname: "[29BD08]布兰登·贾斯珀[-]"
    kind: "Custom_Model"
