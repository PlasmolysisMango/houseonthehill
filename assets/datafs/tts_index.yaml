  - nickname: "[B60000]达瑞“闪电”威廉姆斯[-]"
    kind: "Custom_Model"
    guid: "e4dfd9"
    description: "年龄：20岁 身高：5尺11寸 体重：188磅 爱好：跑步，音乐，莎士比亚文学 生日：6月6日 虽然达瑞跑得很快，“闪电”其实并不是他的本名。不过他挺喜欢被人这么称呼。这绰号安在他头上，就像他最喜欢的那双运动鞋，既舒适，又服帖。达瑞活着就是为了奔跑，同时奔跑也是为了活着。当他停下来不跑的时候，总觉得有什么“很不好的东西”会追上他。达瑞发誓说，有时即便在奔跑中，他也会听见风中传来的细语，那是“很不好的东西”正迅速的从后面逼近他。无怪乎，达瑞成了田径队里的明星。 达瑞与珍妮是邻居。在他眼里，珍妮是个好女孩，就是太安静了些。达瑞也认识左思泽，他是她侄儿。佐伊是达瑞的小侄女，但他们只见过几次面。达瑞最害怕的事就是被那“很不好的东西”给逮住，天晓得那是什么……"
  - nickname: "[CF6801]佐伊·因斯特姆[-]"
    kind: "Custom_Model"
    guid: "939ad6"
    description: "年龄：8岁 身高：3尺9寸 体重：49磅 爱好：玩具娃娃，音乐 生日：11月5日 佐伊最喜欢在自己的房间里和她的玩具娃娃一起玩。她的每个娃娃都有名字，有家庭，有宠物，能使它幸福的一切应有尽有。佐伊常用娃娃给自己演小故事，一般都是些欢乐的故事，但有时娃娃们也会对彼此发火然后打起来。当然，不是像爸爸打妈妈那样。从来没有这码事。至少，小孩子不该议论这事儿。所以，佐伊只和娃娃们玩。 “闪电”达瑞是佐伊的表兄，但她并不认识他。佐伊的妈妈常去找左思泽夫人用塔罗牌算命，佐伊则喜欢在夫人的桌子底下玩娃娃。佐伊家有时和布兰登家合伙儿野营，但佐伊并不喜欢野营，所以她多数时候只是待在帐篷里和娃娃玩儿。佐伊最害怕的是黑人，不管是谁，只要是黑人就怕。"
